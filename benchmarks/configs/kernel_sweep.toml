# Kernel-only benchmark sweep (scope 1). Versioned so a results.json entry can
# name the configuration that produced it.
name = "kernel_sweep"
scope = "kernel"

# Aggregate-trade record counts. 48M only if it fits in device memory.
sizes = [100_000, 1_000_000, 10_000_000]
profiles = ["sparse", "uniform", "burst"]
seeds = [1, 2, 3]
bucket_width_us = 1_000_000

warmup = 25
repeats = 200
synchronize = true

# Row names are documented in benchmarks/kernel.py. Feature rows are gated
# on correctness; the tapeforge_stage_* rows are preparation costs and are
# not summable with the end-to-end rows.
baselines = [
  "tapeforge_triton",
  "tapeforge_prepared",
  "tapeforge_triton_kernel_only",
  "tapeforge_pass1_only",
  "tapeforge_pass2_only",
  "tapeforge_two_pass_forced",
  "torch_eager",
  "torch_compile",
  "numpy_reference",
  "tapeforge_stage_validate",
  "tapeforge_stage_chunk_metadata",
  "tapeforge_stage_allocate",
  "tapeforge_stage_prepare",
]
