# Training-pipeline benchmark on the synthetic smoke experiment: no downloads,
# about a minute on a laptop CPU. It checks that every section runs and yields
# comparable rows; synthetic prices carry no market information.
name = "training-smoke"
scope = "train"
ppo_config = "experiments/configs/smoke-synthetic-ppo.toml"
backends = ["serial", "subprocess", "batched"]
device = "cpu"                 # device of the batched simulator and its policy; "cuda" on a GPU
sections = ["features", "env_step", "batched_core", "policy", "end_to_end"]
model_seed = 0
total_steps = 96000            # per backend, identical sample budget
output_dir = "runs/benchmarks"

feature_episodes = 200
env_step_vector_steps = 2000
core_batch_sizes = [8, 64, 512, 4096]
core_vector_steps = 300

# Predeclared timing target, not a success criterion. Synthetic prices are a
# random walk, so 18.0 bps is simply a level slightly below what the untrained
# policy scores on the synthetic validation day; a run may never reach it.
[threshold]
metric = "validation_mean_shortfall_bps"
max = 18.0
