# Synthetic smoke configuration: three seeded generator days, no data download.
# A demonstration that the experiment, report and replay tools run end to end;
# synthetic prices are a random walk, so the figures carry no market information.
schema = "tapeforge.execution.experiment-config/2"
name = "smoke-synthetic"
label = "smoke"
description = "three synthetic days (uniform profile); demonstration only"

[data]
source = "synthetic"
market = "synthetic"

[data.synthetic]
n_buckets = 3600
profile = "uniform"
days = [
  { date = "2024-01-01", seed = 1 },
  { date = "2024-01-02", seed = 2 },
  { date = "2024-01-03", seed = 3 },
]

[split]
train = ["2024-01-01", "2024-01-02"]
validation = ["2024-01-03"]
test = []

[episodes]
seeds = [1]
episodes_per_day = 50
rho_choices_bps = [200, 500, 1000]
evaluate_roles = ["train", "validation"]

[policies]
names = ["twap", "immediate", "cap_aware_twap", "zero_action"]  # zero_action is a diagnostic

# The accepted first configuration (README, "Execution model") under the primary
# terminal rule: quantity left at the horizon is settled at the terminal mark moved
# 25 bps against the side (an initial smoke setting, not a chosen coefficient).
# risk_lambda stays at zero (off); residual_mu is a legacy-rule parameter and must be 0.
[template]
horizon_buckets = 300
participation_cap_bps = 1000
slippage_ticks = 0
fee_bps = 10
latency_buckets = 0
data_delay_buckets = 0
risk_lambda = 0
residual_mu = 0
arrival_lookback = 60
fill_rule = "bucket_vwap_capped"
terminal_rule = "terminal_settlement"
terminal_surcharge_bps = 25
