[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tapeforge"
version = "0.1.0"
description = "GPU-native market data feature engine: segmented bucket reductions over uneven trade windows."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Joshua Wu", email = "joshwu10806@gmail.com" }]
readme = "README.rst"
dependencies = [
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# CPU development and the PyTorch-facing API; no GPU required.
torch = ["torch>=2.4"]
# GPU engine. Linux with an NVIDIA device only; Triton publishes no macOS wheels.
gpu = ["torch>=2.4", "triton>=3.0"]
# Model training and result reporting.
ml = ["torch>=2.4", "scikit-learn>=1.4", "matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "docutils>=0.21",
]

[project.scripts]
tapeforge-generate = "tapeforge.generate:main"
tapeforge-ingest = "tapeforge.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tapeforge"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires an NVIDIA CUDA GPU with a working Triton install",
    "slow: stress / large-input test, excluded from the default fast run",
]

[tool.coverage.run]
source = ["src/tapeforge"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.12"
packages = ["tapeforge"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Triton ships no type information and publishes no macOS wheels.
module = ["triton", "triton.*"]
ignore_missing_imports = true
