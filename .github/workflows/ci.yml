name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    name: cpu tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          # CPU wheel so the torch-facing tests (ops, validation, baselines) run
          # here instead of skipping; the GPU suite still skips (no CUDA runner).
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e '.[dev]'
      - name: lint
        run: ruff check src tests benchmarks tools
      - name: test
        run: pytest -q --cov=tapeforge --cov-report=term-missing

  rl-adapter:
    name: gymnasium adapter (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          # The optional extra only; the cpu job above covers the package without it.
          pip install -e '.[dev,rl]'
      - name: test the adapter and the optional-import guard
        run: pytest -q tests/test_execution/test_gym_env.py tests/test_execution/test_optional_gymnasium.py
